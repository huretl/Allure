name: APK Android

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build web
        run: npm ci && npm run build && npx cap sync android
      - name: Build APK
        working-directory: android
        env:
          VERSION_NAME: ${{ github.ref_name }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk Allure.apk
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: Allure ${{ github.ref_name }}
          body: "APK à installer sur Android : télécharge **Allure.apk** ci-dessous."
          files: Allure.apk
          make_latest: true
